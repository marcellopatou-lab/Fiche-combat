<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f16">
<title>Fiche de combat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0f16;--surf:#161c26;--surf2:#1f2735;--line:#2c3545;--line2:#3a4557;
  --tx:#eef2f8;--mut:#9aa7ba;--dim:#5d6b80;
  --act:#3ddc84;--bon:#ff9b45;--rea:#b98cff;--fre:#ffcb45;--rage:#ff6b6b;--blu:#6fa8ff;--vio:#a07bff;
  --ok:#3ddc84;--warn:#ffcb45;--bad:#ff6b6b;
  --r:14px;--r2:10px;
  --safeb:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.45;min-height:100vh;
  padding-top:var(--hpad,74px);padding-bottom:calc(68px + var(--safeb))}
body.zen{--hpad:0px}
body.zen #hdr{display:none}
button,select,input,textarea{font-family:inherit;font-size:15px;color:var(--tx)}
button{cursor:pointer}

/* ── EN-TÊTE ───────────────────────────────────────── */
#hdr{position:fixed;top:0;left:0;right:0;z-index:90;background:rgba(9,13,20,.97);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:8px 12px 6px}
#hdr-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#hdr-nm{flex:1;min-width:0;font-size:13px;font-weight:700;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr-nm small{display:block;font-size:10px;font-weight:500;color:var(--mut);letter-spacing:.3px}
#hdr-hp{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
#hdr-bar{height:3px;background:var(--surf2);border-radius:2px;overflow:hidden;margin-bottom:5px}
#hdr-bar i{display:block;height:100%;border-radius:2px;transition:width .25s,background .25s}
#hdr-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:700;border:1px solid;line-height:1.5}
.chip.off{border-color:var(--line2);color:var(--dim);text-decoration:line-through}

/* ── NAVIGATION ────────────────────────────────────── */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:90;background:rgba(9,13,20,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
  height:calc(64px + var(--safeb));padding-bottom:var(--safeb)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;border:none;color:var(--dim);font-size:10px;font-weight:700;padding:0}
.nb i{font-size:20px;font-style:normal;line-height:1}
.nb.on{color:var(--act)}
.nb.on i{transform:translateY(-1px)}

/* ── STRUCTURE ─────────────────────────────────────── */
.tab{display:none;padding:12px 12px 20px}
.tab.on{display:block}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--surf2);
  border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.ch .sub{margin-left:auto;font-size:11px;font-weight:600;color:var(--mut)}
.cb{padding:12px 14px}
.hr{height:1px;background:var(--line);margin:12px 0}
.note{font-size:12px;color:var(--mut);line-height:1.5}
.lbl{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
  padding:10px 14px;border-radius:var(--r2);border:1.5px solid var(--line2);
  background:var(--surf2);color:var(--tx);font-size:14px;font-weight:700}
.btn.sm{min-height:36px;padding:7px 11px;font-size:13px}
.btn.wide{width:100%}
.btn:active{filter:brightness(1.25)}
.btn[disabled]{opacity:.35}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grow{flex:1}

/* ── POINTS DE VIE ─────────────────────────────────── */
.hpbig{display:flex;align-items:baseline;gap:8px}
.hpbig b{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hpbig span{font-size:17px;color:var(--dim)}
.hpbig em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700}
.hpbar{height:12px;background:var(--surf2);border-radius:8px;overflow:hidden;margin:9px 0 11px}
.hpbar i{display:block;height:100%;border-radius:8px;transition:width .25s,background .25s}
.step{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.step button{min-height:52px;border-radius:var(--r2);border:1.5px solid var(--line2);
  background:var(--surf2);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.step button.mi{border-color:#ff6b6b55;color:#ff9b9b}
.step button.pl{border-color:#3ddc8455;color:#8ef0b8}
.step button.eq{border-color:var(--line2);color:var(--mut);font-size:13px}

/* ── ÉCONOMIE D'ACTION ─────────────────────────────── */
.eco{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}
.eco button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:74px;border-radius:var(--r);border:2px solid;background:var(--surf2);padding:6px 4px}
.eco i{font-size:23px;font-style:normal;line-height:1}
.eco b{font-size:12px;font-weight:800;letter-spacing:.3px}
.eco small{font-size:9px;color:var(--dim);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border-radius:22px;padding:8px 13px;min-height:40px;font-size:13px;font-weight:700;
  border:1.5px solid var(--line2);background:var(--surf2);color:var(--mut)}
.pill.on{color:#0b0f16}

/* ── RESSOURCES ────────────────────────────────────── */
.res{display:flex;align-items:center;gap:10px;padding:9px 0}
.res+.res{border-top:1px solid var(--line)}
.res .rn{flex:1;min-width:0;font-size:13px;font-weight:700}
.res .rn small{display:block;font-size:10px;color:var(--dim);font-weight:600}
.pips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:58%}
.pip{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line2);background:var(--surf2);
  font-size:12px;display:flex;align-items:center;justify-content:center;padding:0}

/* ── ARME ──────────────────────────────────────────── */
.wg{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.wb{flex:0 0 auto;min-width:78px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 8px;border-radius:var(--r2);border:1.5px solid var(--line2);background:var(--surf2)}
.wb i{font-size:22px;font-style:normal;line-height:1}
.wb b{font-size:11px;font-weight:700;color:var(--mut)}
.wb small{font-size:9px;color:var(--dim)}
.wb.on{border-color:var(--act);background:#3ddc8414}
.wb.on b{color:var(--act)}
.wb.no{opacity:.42}
.dmgline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--surf2);
  border-radius:var(--r2);padding:10px 12px;margin-top:10px}
.dmgline .dv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.dmgline .dl{font-size:11px;color:var(--mut)}

/* ── LISTE D'ACTIONS ───────────────────────────────── */
.acc{border:1.5px solid;border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.acc>h3{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:13px;font-weight:800}
.acc>h3 .cnt{margin-left:auto;font-size:11px;font-weight:700;opacity:.75}
.acc .bd{display:none;background:var(--surf)}
.acc.open .bd{display:block}
.ar{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.ar.used{opacity:.32}
.ar .tag{flex:0 0 auto;align-self:flex-start;padding:3px 7px;border-radius:6px;font-size:9px;
  font-weight:800;color:#0b0f16;margin-top:2px}
.ar .bo{flex:1;min-width:0}
.ar .an{font-size:14px;font-weight:700;margin-bottom:3px}
.ar .am{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:3px}
.ar .am b{color:var(--tx);font-weight:800}
.ar .ae{font-size:12px;color:#93a1b8;line-height:1.5}
.banner{padding:7px 14px;font-size:12px;border-left:3px solid;line-height:1.45}

/* ── FICHE ─────────────────────────────────────────── */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.box{background:var(--surf2);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px}
.box .bl{font-size:11px;color:var(--mut);margin-bottom:2px}
.box .bv{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.box .bs{font-size:10px;color:var(--dim)}
.tagl{display:flex;flex-wrap:wrap;gap:6px}
.tg{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--surf2);
  border:1px solid var(--line);color:var(--mut)}
.feat{border-left:3px solid var(--blu);padding:2px 0 2px 11px;margin-bottom:12px}
.feat h4{font-size:14px;font-weight:700;margin-bottom:1px}
.feat .en{font-size:11px;color:var(--dim);margin-bottom:6px}
.feat p{font-size:12px;color:#93a1b8;line-height:1.5;margin-bottom:4px}
.feat p b{color:var(--tx)}
/* ── ÉTATS ─────────────────────────────────────────── */
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cbn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 5px;
  border-radius:var(--r2);border:1.5px solid var(--line2);background:var(--surf2)}
.cbn i{font-size:19px;font-style:normal;line-height:1}
.cbn b{font-size:11px;font-weight:700;color:var(--mut)}
.cbn small{font-size:9px;color:var(--dim);line-height:1.3;text-align:center}
.cbn.on{border-color:var(--bad);background:#ff6b6b18}
.cbn.on b{color:var(--bad)}

/* ── OUTIL LANCER ──────────────────────────────────── */
.szb{padding:9px 11px;border-radius:var(--r2);border:1.5px solid var(--line2);background:var(--surf2);
  color:var(--mut);font-size:12px;font-weight:700;text-align:left;line-height:1.3}
.szb small{display:block;font-size:9px;font-weight:500;color:var(--dim)}
.szb.on{border-color:var(--blu);background:#6fa8ff20;color:var(--blu)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:6px 5px;font-size:10px;color:var(--mut);border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.tbl td.nm{text-align:left;font-size:11px}
.tbl tr.hi{background:#6fa8ff1a;outline:1.5px solid var(--blu)}

/* ── PERSOS / ÉDITEUR ──────────────────────────────── */
.chr{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chr:last-child{border-bottom:none}
.chr .av{width:40px;height:40px;border-radius:11px;background:var(--surf2);border:1.5px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.chr.on .av{border-color:var(--act);background:#3ddc8414}
.chr .ci{flex:1;min-width:0}
.chr .ci b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chr .ci small{font-size:11px;color:var(--mut)}
.ico{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line2);background:var(--surf2);
  display:flex;align-items:center;justify-content:center;font-size:16px;padding:0;flex:0 0 auto}
.f{margin-bottom:11px}
.f>label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px}
.f>label .hint{font-weight:500;color:var(--dim)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surf2);
  border:1.5px solid var(--line2);border-radius:var(--r2);padding:11px 12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blu)}
textarea{min-height:76px;resize:vertical;line-height:1.5}
select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#9aa7ba 50%),linear-gradient(135deg,#9aa7ba 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:34px}
.fr{display:flex;gap:9px}
.fr>.f{flex:1;min-width:0}
.sw{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sw .sl{flex:1;font-size:13px;font-weight:600}
.sw .sl small{display:block;font-size:11px;color:var(--dim);font-weight:400}
.tgl{width:48px;height:28px;border-radius:16px;background:var(--surf2);border:1.5px solid var(--line2);
  position:relative;flex:0 0 auto;padding:0;transition:background .15s,border-color .15s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--dim);transition:transform .15s,background .15s}
.tgl.on{background:#3ddc8426;border-color:var(--act)}
.tgl.on::after{transform:translateX(20px);background:var(--act)}
.item{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:9px;overflow:hidden;background:var(--surf2)}
.item>.ih{display:flex;align-items:center;gap:9px;padding:10px 12px}
.item>.ih .it{flex:1;min-width:0;font-size:13px;font-weight:700}
.item>.ih .it small{display:block;font-size:11px;color:var(--dim);font-weight:500}
.item>.ib{display:none;padding:12px;border-top:1px solid var(--line);background:var(--surf)}
.item.open>.ib{display:block}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}

/* ── MODALES / TOAST ───────────────────────────────── */
.mdl{position:fixed;inset:0;z-index:200;background:rgba(4,7,12,.8);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center}
.mdl.open{display:flex}
.mdl>.mc{width:100%;max-width:520px;background:var(--surf);border:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:16px 16px calc(18px + var(--safeb));max-height:88vh;overflow-y:auto}
.mh{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.mh b{flex:1;font-size:17px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kp button{min-height:58px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surf2);
  font-size:22px;font-weight:700}
.kpv{text-align:center;font-size:36px;font-weight:800;padding:10px 0 16px;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safeb));transform:translateX(-50%) translateY(16px);
  z-index:300;background:#e8eef8;color:#0b0f16;padding:11px 18px;border-radius:24px;font-size:13px;
  font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══ VERSION ÉPURÉE ══════════════════════════════════ */
html{background:var(--bg)}
body{padding-top:64px}
#hdr{padding:calc(9px + env(safe-area-inset-top,0px)) 14px 7px}
#hdr-top{margin-bottom:6px;gap:10px}
#hdr-nm{font-size:14px}
#hdr-hp{display:flex;align-items:baseline;gap:10px;font-size:16px}
#hdr-hp .hs{font-size:13px;font-weight:700;color:var(--mut)}
#hdr-hp .mx{font-size:12px;color:var(--dim);font-weight:600}
#hdr-chips{margin-top:6px}
#hdr-chips:empty{display:none}
#fsb{width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--surf2);
  font-size:14px;padding:0;flex:0 0 auto;color:var(--mut)}

.hpc{display:flex;align-items:center;gap:10px;padding:13px 14px 0}
.hpn{background:none;border:none;padding:0;display:flex;align-items:baseline;gap:5px;text-align:left}
.hpn b{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hpn span{font-size:15px;color:var(--dim);font-weight:600}
.hps{margin-left:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:0 1 216px}
.hps button{height:48px;border-radius:11px;border:1.5px solid var(--line2);background:var(--surf2);
  font-size:15px;font-weight:800}
.hps .mi{border-color:#ff6b6b55;color:#ff9b9b}
.hps .pl{border-color:#3ddc8455;color:#8ef0b8}
.hpc+.hpbar{margin:11px 14px 14px}

.ch .lnk{margin-left:auto;background:none;border:none;color:var(--mut);font-size:13px;font-weight:700;padding:2px 0}
.eco button{min-height:60px;gap:2px}
.eco i{font-size:19px}
.eco b{font-size:13px}
.sup{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:9px;padding:9px 12px;border-radius:var(--r2);
  border:1px solid #a07bff55;background:#a07bff14;color:var(--vio);font-size:13px;font-weight:700;text-align:left}
.sup span{margin-left:auto;color:var(--dim)}

.rrow{display:flex;align-items:center;gap:9px}
.rrow .btn{flex:1;min-height:54px;font-size:16px}
.flames{display:flex;gap:3px;margin-top:9px;align-items:center}
.flames button{background:none;border:none;padding:2px;font-size:21px;line-height:1}
.flames span{margin-left:6px;font-size:12px;color:var(--mut);font-weight:700}

.lr{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;background:none;border:none;
  border-top:1px solid var(--line);text-align:left}
.lr:first-child{border-top:none}
.lr .li{font-size:19px;width:26px;text-align:center;flex:0 0 auto}
.lr .lt{flex:1;min-width:0;font-size:14px;font-weight:700}
.lr .lt small{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:1px}
.lr .lv{font-size:14px;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.lr .chev{color:var(--dim);font-size:17px;flex:0 0 auto}
.lr.sel{background:#3ddc8412}
.lr.sel .lt{color:var(--act)}
.lr.no{opacity:.4}

.wbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 14px 4px}
.wbig b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.wbig span{font-size:13px;color:var(--mut)}
.wsup{padding:0 14px;font-size:12px;color:var(--vio);font-weight:600}
.tgs{display:flex;gap:6px;padding:11px 14px 13px}
.tgs button{flex:1;min-height:40px;border-radius:10px;border:1.5px solid var(--line2);background:var(--surf2);
  font-size:12px;font-weight:700;color:var(--mut)}

.sec{margin-bottom:12px;border-radius:var(--r);background:var(--surf);border:1px solid var(--line);
  border-left:4px solid;overflow:hidden}
.sec>h3{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:14px;font-weight:800;cursor:pointer}
.sec>h3 .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--mut)}
.xr{border-top:1px solid var(--line)}
.xr.off{opacity:.45}
.xh{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:none;border:none;text-align:left}
.xh .xn{flex:1;min-width:0;font-size:14px;font-weight:700}
.xh .xn small{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:2px}
.xh .xd{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.xb{padding:0 14px 13px;font-size:13px;color:#a3b0c4;line-height:1.55}
.xb .en{font-size:11px;color:var(--dim);margin-bottom:4px}
.xb .btn{margin-top:10px}
.more{display:block;width:100%;padding:11px;border:none;border-top:1px solid var(--line);background:none;
  color:var(--mut);font-size:12px;font-weight:700}
.warnl{padding:0 14px 12px;font-size:13px;font-weight:800;color:var(--bad)}

function mod(v){return Math.floor((v-10)/2);}
function sgn(n){return (n>=0?'+':'−')+Math.abs(n);}
function m(v){return String(Math.round(v*10)/10).replace('.',',')+'m';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(ch){
  return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[ch];});}

/* ── variables disponibles dans les formules ────────── */
function V(c){
  c=c||C();var s=c.stats,lv=c.level;
  var pb=1+Math.ceil(lv/4);
  var rd=c.rageDmg&&c.rageDmg[lv]!=null?c.rageDmg[lv]:0;
  var v={FOR:mod(s.str),DEX:mod(s.dex),CON:mod(s.con),INT:mod(s.int),SAG:mod(s.wis),CHA:mod(s.cha),
    PB:pb,NIV:lv,RD:rd,VIT:c.speed||9};
  v.ATH=v.FOR+pb;v.DD=8+pb+v.FOR;
  v.DM=v.FOR+(c.st.rage?rd:0);

}
function pvMax(c){c=c||C();var t=c.hpTable||{};if(t[c.level]!=null)return t[c.level];

/* ── évaluateur arithmétique (+ − × parenthèses) ─────── */
function num(expr,v){
  if(expr==null||expr==='')return 0;
  if(typeof expr==='number')return expr;
  var s=String(expr),i=0;
  function ws(){while(s[i]===' ')i++;}
  function prim(){ws();
    if(s[i]==='('){i++;var r=add();ws();if(s[i]===')')i++;return r;}
    if(s[i]==='-'){i++;return -prim();}
    if(s[i]==='+'){i++;return prim();}
    var st=i;while(i<s.length&&/[A-Za-z0-9_.]/.test(s[i]))i++;
    var tk=s.slice(st,i);if(tk==='')  {i++;return 0;}
    if(/^[0-9.]+$/.test(tk))return parseFloat(tk);
    var up=tk.toUpperCase();return v&&v[up]!=null?v[up]:0;}
  function mul(){var r=prim();for(;;){ws();
    if(s[i]==='*'){i++;r*=prim();}else if(s[i]==='/'){i++;var d=prim();r=d?r/d:0;}else return r;}}
  function add(){var r=mul();for(;;){ws();
    if(s[i]==='+'){i++;r+=mul();}else if(s[i]==='-'){i++;r-=mul();}else return r;}}
  var out=add();return isNaN(out)?0:out;
}

/* ── dégâts : { dés:{"6|feu":n}, plat:n } ───────────── */
var ELEM={tonnerre:'⚡',feu:'🔥',froid:'❄️',foudre:'🌩️',acide:'☠️',radiant:'✨',necrotique:'💀',poison:'🧪'};
function newD(){return{d:{},f:0};}
function addDice(o,n,faces,tag){var k=faces+'|'+(tag||'');o.d[k]=(o.d[k]||0)+n;}
function parseD(expr,v,out){
  out=out||newD();if(expr==null||expr==='')return out;
  var parts=String(expr).replace(/−/g,'-').split(/(?=[+-])/);
  parts.forEach(function(p){
    p=p.trim();if(!p)return;
    var neg=p[0]==='-';if(p[0]==='+'||p[0]==='-')p=p.slice(1).trim();
    var mm=p.match(/^(\d*)d(\d+)(?:@([A-Za-zéèêàûôî]+))?$/i);
    if(mm){var n=(mm[1]===''?1:parseInt(mm[1],10))*(neg?-1:1);addDice(out,n,mm[2],mm[3]?mm[3].toLowerCase():'');}
    else{var q=num(p,v);out.f+=neg?-q:q;}
  });
  return out;
}
function scaleDice(o,k){var r=newD();r.f=o.f;for(var key in o.d)r.d[key]=o.d[key]*k;return r;}
function mergeD(a,b){for(var k in b.d)a.d[k]=(a.d[k]||0)+b.d[k];a.f+=b.f;return a;}
function fmtD(o){
  var keys=Object.keys(o.d).filter(function(k){return o.d[k]!==0;});
  keys.sort(function(a,b){var ta=a.split('|')[1],tb=b.split('|')[1];
    if(!ta&&tb)return -1;if(ta&&!tb)return 1;return parseInt(b)-parseInt(a);});
  var s=keys.map(function(k){var p=k.split('|');
    return o.d[k]+'d'+p[0]+(p[1]?(ELEM[p[1]]||'·'+p[1]):'');}).join('+');
  if(o.f)s+=(o.f>0?'+':'−')+Math.abs(o.f);
  return s||'—';
}

/* ── armes ──────────────────────────────────────────── */
function wpnById(c,id){var a=(c||C()).weapons;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function heldW(c){c=c||C();return wpnById(c,c.st.wpn)||c.weapons[0];}
function twoHanded(c){c=c||C();return !c.st.shield&&c.st.twoH;}
function wBlocked(c,w){return !!(c.st.shield&&w.needsTwoHands);}
function reach(c,w,react){
  c=c||C();if(w.category!=='melee')return null;
  var r=1.5+(w.reach||0);
  if(c.st.rage)r+=(c.reachRage||0);
  if(!react)r+=(c.reachTurn||0);
  return r;
}
function rangeTxt(c,w,thrown){
  if(w.category==='ranged'||thrown){
    if(w.range)return w.range;
    if(w.thrownFromReach){var b=reach(c,w,false)||1.5;return m(b+6)+' / '+m(b+18);}
    return '—';
  }
  return m(reach(c,w,false))+' · réac '+m(reach(c,w,true));
}
function wDice(c,w,thrown){
  var d=w.dice;
  if(!thrown&&w.versatile&&twoHanded(c))d=w.versatile;
  return d;
}
function dmgOf(c,w,o){
  c=c||C();o=o||{};var v=V(c),st=c.st,out=newD();
  var base=parseD(o.dice||wDice(c,w,o.thrown),v);
  if(st.rage&&w.rageDouble!==false&&c.rageDoubleDice)base=scaleDice(base,2);
  mergeD(out,base);
  if(st.rage&&st.feWpn===w.id&&w.fe!==false&&c.feDice)parseD(c.feDice+'@'+st.feEl,v,out);
  if(o.extra)parseD(o.extra,v,out);
  out.f+=v.FOR+(st.rage?v.RD:0);
  return out;
}
function surpTxt(c){c=c||C();return (c.st.surprise&&c.surpriseDice)?('+'+c.surpriseDice+' au 1er toucher'):'';}
function dmgTxt(c,w,o){o=o||{};var s=fmtD(dmgOf(c,w,o));

/* ── interpolation {DD} {ATH} {PB} … ────────────────── */
function interp(s,c){
  c=c||C();var v=V(c);
  return String(s||'').replace(/\{(\w+)\}/g,function(_,k){

    if(v[K]!=null)return (K==='ATH'||K==='FOR'||K==='DEX'||K==='CON'||K==='SAG'||K==='CHA'||K==='INT')?sgn(v[K]):String(v[K]);
    return '{'+k+'}';});
}
function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1);}

/* ── disponibilité d'une action ─────────────────────── */
function avail(c,a){

    var w=wpnById(c,r.wpn[0]);return (w?w.name:r.wpn[0])+' requise';}
  if(r.pool&&(st.pool[r.pool]||0)<=0)return 'épuisé';
  return null;
}
function spent(c,a){

  if(a.type==='reaction')return st.used.reaction;

/* ══════════════════════════════════════════════════════════
   RENDU — en-tête, Tour, panneaux de détail, Actions
   ══════════════════════════════════════════════════════════ */
function $(id){return document.getElementById(id);}
var toastT=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},1900);}
function hpCol(p){return p>50?'var(--ok)':p>25?'var(--warn)':'var(--bad)';}
function hpPct(c){return Math.max(0,Math.min(100,c.st.pv/pvMax(c)*100));}
var ECO={action:{l:'Action',i:'⚡',c:'var(--act)'},ba:{l:'Bonus',i:'🔶',c:'var(--bon)'},
  reaction:{l:'Réaction',i:'🔷',c:'var(--rea)'}};
function hasRage(c){return (c.pools||[]).some(function(p){return p.id==='rage';});}
function usesReckless(c){return (c.actions||[]).some(function(a){return a.req&&a.req.reckless;});}
function isFS(){try{return !!document.fullscreenElement||matchMedia('(display-mode: fullscreen)').matches;}catch(e){return false;}}

function renderAll(){
  var c=C();document.title=c.icon+' '+c.name;
  renderHdr();
  ({tour:renderTour,actions:renderActions,fiche:renderFiche,lancer:renderLancer,perso:renderPerso})[UI.tab]();
  if(SHEET)renderSheet();
  save();
}

/* ── EN-TÊTE : nom, CA, PV, et seulement ce qui est actif ── */
function renderHdr(){
  var c=C(),st=c.st,p=hpPct(c),col=hpCol(p);
  $('hdr-nm').textContent=c.icon+' '+c.name;
  $('hdr-hp').innerHTML='<span class="hs">🛡 '+acVal(c)+'</span>'
    +'<span style="color:'+col+';font-weight:800">'+st.pv+'<span class="mx">/'+pvMax(c)+'</span></span>';
  var bar=$('hdr-bar').firstElementChild;bar.style.width=p+'%';bar.style.background=col;
  var out=[];
  if(st.rage)out.push(chip('👹 Rage','var(--rage)'));
  if(st.reckless)out.push(chip('⚡ Téméraire','var(--rage)'));
  COND.forEach(function(x){if(st.cond[x.id])out.push(chip(x.e+' '+x.l,'var(--bad)'));});
  $('hdr-chips').innerHTML=out.join('');
  $('fsb').style.display=isFS()?'none':'';
  document.body.style.paddingTop=$('hdr').offsetHeight+'px';
}
function tint(c,p){return 'color-mix(in srgb,'+c+' '+p+'%,transparent)';}
function chip(t,c){return '<span class="chip" style="color:'+c+';border-color:'+c+';background:'+tint(c,12)+'">'+esc(t)+'</span>';}

/* ── ONGLET TOUR ────────────────────────────────────── */
function renderTour(){
  var c=C(),st=c.st,v=V(c),p=hpPct(c),col=hpCol(p),h='';

  /* PV */
  h+='<div class="card"><div class="hpc">'
   +'<button class="hpn" onclick="askPV()"><b style="color:'+col+'">'+st.pv+'</b><span>/ '+pvMax(c)+'</span></button>'
   +'<div class="hps"><button class="mi hold" data-d="-5">−5</button><button class="mi hold" data-d="-1">−1</button>'
   +'<button class="pl hold" data-d="1">+1</button><button class="pl hold" data-d="5">+5</button></div></div>'
   +'<div class="hpbar"><i style="width:'+p+'%;background:'+col+'"></i></div>'
   +(st.pv===0?'<div class="warnl">💀 Inconscient</div>':'')+'</div>';

  /* Ce tour */
  h+='<div class="card"><div class="ch">Tour '+st.turn+'<button class="lnk" onclick="openSheet(\'turn\')">Plus ⋯</button></div><div class="cb">'
   +(st.surprise&&c.surpriseDice?'<button class="sup" onclick="tog(\'surprise\')">⭐ Surprise : +'+esc(c.surpriseDice)+' au 1er toucher<span>✕</span></button>':'')
   +'<div class="eco">'+['action','ba','reaction'].map(function(k){
      var u=st.used[k],e=ECO[k];
      return '<button onclick="useRes(\''+k+'\')" style="border-color:'+(u?'var(--line2)':e.c)+';background:'+(u?'var(--surf2)':'transparent')+'">'
        +'<i style="opacity:'+(u?.3:1)+'">'+e.i+'</i><b style="color:'+(u?'var(--dim)':e.c)+(u?';text-decoration:line-through':'')+'">'+e.l+'</b></button>';}).join('')
   +'</div><button class="btn wide" onclick="nextTurn()" style="border-color:var(--act);color:var(--act)">↻ Tour suivant</button>'
   +'</div></div>';

  /* Rage */
  if(hasRage(c)){
    var nr=(st.pool.rage||0)<=0&&!st.rage,mxr=Math.round(num((c.pools.filter(function(q){return q.id==='rage';})[0]).max,v)),fl='';
    for(var i=0;i<mxr;i++)fl+='<button onclick="setPool(\'rage\','+(i+1)+')" style="opacity:'+(i<(st.pool.rage||0)?1:.18)+'">🔥</button>';
    h+='<div class="card"><div class="cb"><div class="rrow">'
     +'<button class="btn" onclick="toggleRage()" '+(nr?'disabled':'')+' style="border-color:'+(st.rage?'var(--rage)':'#ff6b6b80')
     +';background:'+(st.rage?'var(--rage)':'var(--surf2)')+';color:'+(st.rage?'#140a0a':'var(--rage)')+'">'
     +(st.rage?'👹 En rage':nr?'Plus de rage':'💤 Entrer en rage')+'</button>'
     +'<button class="ico" onclick="openSheet(\'rage\')" aria-label="Effets de la rage">ⓘ</button></div>'
     +'<div class="flames">'+fl+'<span>'+(st.pool.rage||0)+'/'+mxr+' restantes</span></div>'
     +'</div></div>';
  }

  /* Arme */
  var w=heldW(c);
  h+='<div class="card"><button class="lr" onclick="openSheet(\'weapon\')"><span class="li">'+w.icon+'</span>'
   +'<span class="lt">'+esc(w.name)+(w.versatile?'<small>'+(twoHanded(c)?'à deux mains':'à une main')+'</small>':'')+'</span>'
   +'<span class="chev">Changer ›</span></button>'
   +'<div class="wbig"><b style="color:'+(st.rage?'var(--rage)':'var(--tx)')+'">'+esc(dmgTxt(c,w,{count:c.attacks||1}))+'</b>'
   +'<span>'+esc(rangeTxt(c,w))+'</span></div>'
   +(st.rage&&st.feWpn===w.id&&c.feDice?'<div class="wsup" style="color:var(--mut)">'+ELEM[st.feEl]+' Fendoir '+cap(st.feEl)+'</div>':'')
   +'<div class="tgs">'
   +(usesReckless(c)?tgBtn('⚡ Téméraire',st.reckless,'var(--rage)',"tog('reckless')"):'')
   +tgBtn('🛡️ Bouclier',st.shield,'var(--fre)',"tog('shield')")
   +(w.versatile&&!st.shield?tgBtn('✋ 2 mains',st.twoH,'var(--act)',"tog('twoH')"):'')
   +'</div></div>';

  /* Ressources + états */
  var rows=(c.pools||[]).filter(function(q){return q.id!=='rage';}).map(function(q){
    var mx=Math.round(num(q.max,v)),cur=st.pool[q.id]||0;
    return '<button class="lr" onclick="openSheet(\'pool:'+q.id+'\')"><span class="li">'+q.icon+'</span>'
      +'<span class="lt">'+esc(q.name)+'</span><span class="lv" style="color:'+(cur?'var(--tx)':'var(--dim)')+'">'+cur+' / '+mx+'</span>'
      +'<span class="chev">›</span></button>';});
  var ac=COND.filter(function(x){return st.cond[x.id];});
  rows.push('<button class="lr" onclick="openSheet(\'cond\')"><span class="li">🩹</span><span class="lt">États</span>'
    +'<span class="lv" style="color:'+(ac.length?'var(--bad)':'var(--dim)')+'">'+(ac.length?ac.map(function(x){return x.l;}).join(', '):'aucun')+'</span>'
    +'<span class="chev">›</span></button>');
  h+='<div class="card">'+rows.join('')+'</div>';

  $('t-tour').innerHTML=h;
}
function tgBtn(t,on,c,fn){return '<button onclick="'+fn+'" style="'+(on?'border-color:'+c+';background:'+tint(c,14)+';color:'+c:'')+'">'+esc(t)+'</button>';}

/* ── PANNEAUX DE DÉTAIL (feuilles du bas) ───────────── */
function openSheet(n){SHEET=n;renderSheet();$('mdl').classList.add('open');}
function sheetHead(t){return '<div class="mh"><b>'+t+'</b><button class="ico" onclick="closeMdl()">✕</button></div>';}

        +'<span class="lt">'+esc(x.name)+'<small>'+esc(dmgTxt(c,x,{count:c.attacks||1,thrown:x.category!=='melee'}))
        +' · '+esc(x.category==='melee'?m(reach(c,x,false)):(x.range||''))+'</small></span>'
        +'<span class="chev">'+(on?'✓':no?'🛡️':'')+'</span></button>';}).join('')+'</div>';
    var w=heldW(c);
    if(w.mastery||w.eff)h+='<div class="note" style="margin-bottom:12px"><b style="color:var(--tx)">'+esc(w.mastery||'')+'</b>'
      +(w.eff?(w.mastery?' — ':'')+interp(w.eff,c):'')+'</div>';
    if(c.feDice){

       +'<div class="f"><select onchange="setFE(\'w\',this.value)">'+c.weapons.filter(function(x){return x.fe!==false&&!wBlocked(c,x);})
       .map(function(x){return '<option value="'+x.id+'"'+(st.feWpn===x.id?' selected':'')+'>'+x.icon+' '+esc(x.name)+'</option>';}).join('')+'</select></div>'
       +'<div class="pills">'+Object.keys(ELEM).slice(0,5).map(function(k){
         return '<button class="pill'+(st.feEl===k?' on':'')+'" onclick="setFE(\'e\',\''+k+'\')"'
           +(st.feEl===k?' style="background:var(--blu);border-color:var(--blu)"':'')+'>'+ELEM[k]+' '+cap(k)+'</button>';}).join('')+'</div>';
    }
  }
  else if(SHEET==='rage'){
    h=sheetHead('Effets de la rage')+'<div class="card">'+(c.rageTags||[]).map(function(t){
      return '<div class="lr"><span class="lt" style="font-weight:600">'+esc(interp(t,c))+'</span></div>';}).join('')+'</div>'
     +'<div class="note">Rages restantes : '+(st.pool.rage||0)+' · recharge au repos long.</div>';
  }
  else if(SHEET&&SHEET.indexOf('pool:')===0){
    var id=SHEET.slice(5),q=(c.pools||[]).filter(function(x){return x.id===id;})[0];
    if(!q){closeMdl();return;}
    var mx=Math.round(num(q.max,v)),cur=st.pool[id]||0;
    h=sheetHead(q.icon+' '+esc(q.name))
     +'<div class="kpv">'+cur+' <span style="font-size:18px;color:var(--dim)">/ '+mx+'</span></div>'
     +'<div class="row"><button class="btn grow" style="min-height:56px;font-size:20px" onclick="addPool(\''+id+'\',-1)">−</button>'
     +'<button class="btn grow" style="min-height:56px;font-size:20px" onclick="addPool(\''+id+'\',1)">+</button></div>'
     +'<div class="note" style="margin-top:12px">'+esc((q.sub?q.sub+' · ':'')+'Recharge : '+(q.recharge||'—'))+'</div>';

        +'<i>'+x.e+'</i><b>'+x.l+'</b><small>'+esc(x.d)+'</small></button>';}).join('')+'</div>'
     +'<div class="note" style="margin-top:12px">Résolu : avantage sur toute sauvegarde qui appliquerait un de ces états.</div>';
  }

     +pill('🔗 Traction',!st.used.traction,'var(--fre)',"useRes('traction')")
     +pill('🔁 Changement d\u2019arme',!st.used.wpnChg,'var(--fre)',"useRes('wpnChg')")+'</div>'
     +'<div class="lbl">Situation</div><div class="pills" style="margin-bottom:16px">'
     +(c.surpriseDice?pill('⭐ Surprise +'+c.surpriseDice,st.surprise,'var(--vio)',"tog('surprise')"):'')

function pill(t,on,c,fn){return '<button class="pill'+(on?' on':'')+'" onclick="'+fn+'"'

/* ── ONGLET ACTIONS : l'essentiel, le détail au toucher ── */
function actAttacks(c){
  var out=[],st=c.st,n=c.attacks||1;
  c.weapons.forEach(function(w){
    if(wBlocked(c,w))return;
    var thrown=w.category!=='melee';
    out.push({id:'atk-'+w.id,type:'action',name:(n>1?n+'× ':'')+w.name,icon:w.icon,
      _w:w,_count:n,_thrown:thrown,range:rangeTxt(c,w,thrown),
      eff:(w.mastery?'<b>'+esc(w.mastery)+'</b> — ':'')+(w.eff||''),req:{wpn:[w.id]}});
  });
  if(st.rage&&c.feDice){
    var fw=wpnById(c,st.feWpn);
    if(fw&&fw.thrownFromReach)out.push({id:'atk-fe',type:'action',icon:ELEM[st.feEl],
      name:(n>1?n+'× ':'')+fw.name+' lancée',_w:fw,_count:n,_thrown:true,range:rangeTxt(c,fw,true),
      eff:"Fendoir élémentaire · Retour automatique en main · Dégâts de "+cap(st.feEl),req:{rage:1,wpn:[fw.id]}});
  }
  return out;
}
var SEC=[['action','Action','var(--act)','action'],['bonus','Action bonus','var(--bon)','ba'],
         ['reaction','Réaction','var(--rea)','reaction'],['free','Gratuit','var(--fre)',null]];
function renderActions(){
  var c=C(),st=c.st,all=actAttacks(c).concat(c.actions||[]),h='';
  SEC.forEach(function(s){
    var k=s[0],ok=[],ko=[];
    all.filter(function(a){return a.type===k;}).forEach(function(a){
      var why=avail(c,a);(why?ko:ok).push([a,why]);});
    var used=s[3]&&st.used[s[3]],open=UI.open[k];
    h+='<div class="sec" style="border-left-color:'+s[2]+'"><h3 onclick="UI.open[\''+k+'\']=!UI.open[\''+k+'\'];renderActions()" style="color:'+s[2]+'">'
     +s[1]+'<span class="st">'+(s[3]?(used?'utilisée':'libre'):'')+' '+(open?'▾':'▸')+'</span></h3>';
    if(open){
      ok.forEach(function(x){h+=xrow(c,x[0],null);});
      if(!ok.length)h+='<div class="xb" style="padding-top:2px">Rien de jouable pour l\u2019instant.</div>';
      if(ko.length){
        h+='<button class="more" onclick="UI.more[\''+k+'\']=!UI.more[\''+k+'\'];renderActions()">'
          +(UI.more[k]?'Masquer les indisponibles':'Voir '+ko.length+' option'+(ko.length>1?'s':'')+' indisponible'+(ko.length>1?'s':''))+'</button>';
        if(UI.more[k])ko.forEach(function(x){h+=xrow(c,x[0],x[1]);});
      }
    }
    h+='</div>';
  });
  $('t-actions').innerHTML=h;
}
function actDmg(c,a){
  if(a._w)return dmgTxt(c,a._w,{count:a._count,thrown:a._thrown});
  if(a.wpn){var w=a.wpn==='held'?heldW(c):wpnById(c,a.wpn);if(w)return dmgTxt(c,w,{dice:a.dice,count:a.count||1});}
  if(a.dmg)return fmtD(parseD(a.dmg,V(c)));
  return '';
}
function xrow(c,a,why){
  var st=c.st,exp=UI.exp===a.id,used=spent(c,a),dmg=actDmg(c,a);
  var sub=[];if(a.range)sub.push('📍 '+interp(a.range,c));if(why)sub.push(why);else if(used)sub.push('déjà utilisée');
  if(a.pool)sub.push((st.pool[a.pool]||0)+' restant');
  var h='<div class="xr'+(why||used?' off':'')+'"><button class="xh" onclick="UI.exp=UI.exp===\''+a.id+'\'?null:\''+a.id+'\';renderActions()">'
    +'<span class="xn">'+(a.icon?a.icon+' ':'')+esc(a.name)+'<small>'+esc(sub.join(' · '))+'</small></span>'
    +(dmg&&dmg!=='—'?'<span class="xd" style="color:'+(st.rage?'var(--rage)':'var(--tx)')+'">'+esc(dmg)+'</span>':'')
    +'</button>';
  if(exp){
    h+='<div class="xb">'+(a.en?'<div class="en">'+esc(a.en)+'</div>':'')+interp(a.eff||'',c);
    if(a._w&&surpTxt(c))h+='<div style="color:var(--vio);margin-top:4px">⭐ '+surpTxt(c)+'</div>';
    if(!why&&!used){
      var lab=a.tool?'Ouvrir le calcul de lancer':a.pool?'Utiliser (−1)':a.free?'Marquer comme utilisé':
        ({action:'Marquer l\u2019action utilisée',bonus:'Marquer l\u2019action bonus utilisée',reaction:'Marquer la réaction utilisée'})[a.type];
      if(lab)h+='<button class="btn sm wide" onclick="doAction(\''+a.id+'\')">'+lab+'</button>';
    }
    h+='</div>';
  }
  return h+'</div>';
}
/* ── ONGLET FICHE : repères visibles, détails repliés ─ */
function fAcc(key,title,summary,body){
  var op=UI.fo[key];
  return '<div class="card"><button class="lr" onclick="UI.fo[\''+key+'\']=!UI.fo[\''+key+'\'];renderFiche()">'
    +'<span class="lt">'+title+'<small>'+summary+'</small></span><span class="chev">'+(op?'▾':'▸')+'</span></button>'
    +(op?'<div class="cb" style="border-top:1px solid var(--line)">'+body+'</div>':'')+'</div>';
}
function renderFiche(){
  var c=C(),st=c.st,v=V(c),h='';
  h+='<div class="card"><div class="cb"><div class="grid3">'
   +box('CA',acVal(c),st.shield?'avec bouclier':'')
   +box('PV max',pvMax(c),'')
   +box('Vitesse',m(c.speed||9),'')
   +box('Initiative',sgn(v.DEX),'avantage')
   +box('DD',v.DD,'')
   +box('Athlétisme',sgn(v.ATH),'')
   +'</div></div></div>';

  var SN={str:'FOR',dex:'DEX',con:'CON',int:'INT',wis:'SAG',cha:'CHA'};
  var adv=c.saveAdv||{},prof=c.saveProf||[];
  h+=fAcc('sv','🎲 Caractéristiques et sauvegardes',
    prof.map(function(k){return SN[k]+' '+sgn(mod(c.stats[k])+v.PB);}).join(' · ')+' maîtrisées',
    '<div class="grid3">'+Object.keys(SN).map(function(k){
      var pr=prof.indexOf(k)>=0,sv=mod(c.stats[k])+(pr?v.PB:0),a=adv[k];
      return '<div class="box" style="'+(pr?'border-color:#ffcb4550':'')+'">'
        +'<div class="bl">'+SN[k]+' '+c.stats[k]+' · test '+sgn(mod(c.stats[k]))+'</div>'
        +'<div class="bv" style="color:'+(pr?'var(--fre)':'var(--tx)')+'">'+sgn(sv)+'</div>'
        +'<div class="bs" style="color:'+(a?'var(--act)':'var(--dim)')+'">'+(a?'avantage · '+esc(a):(pr?'maîtrise':'—'))+'</div></div>';}).join('')
    +'</div>'
    +((c.advNotes||[]).length?'<div class="hr"></div><div class="lbl">Avantages selon la situation</div>'
      +(c.advNotes||[]).map(function(n){return '<div class="note" style="margin-bottom:5px"><b style="color:var(--tx)">'

function setTab(t){UI.tab=t;
  ['tour','actions','fiche','lancer','perso'].forEach(function(k){$('t-'+k).className='tab'+(k===t?' on':'');});
  Array.prototype.forEach.call(document.querySelectorAll('.nb'),function(b){b.className='nb'+(b.dataset.t===t?' on':'');});

function toggleFS(){
  try{var d=document,el=d.documentElement;
    if(!d.fullscreenElement){var p=el.requestFullscreen({navigationUI:'hide'});if(p&&p.catch)p.catch(function(){toast('Plein écran indisponible ici');});}
    else d.exitFullscreen();}catch(e){toast('Plein écran indisponible ici');}}
function dPV(d){var st=T();st.pv=Math.max(0,Math.min(pvMax(),st.pv+d));renderAll();}
function setPV(n){var st=T();st.pv=Math.max(0,Math.min(pvMax(),n|0));renderAll();}
function useRes(k){var st=T();st.used[k]=!st.used[k];renderAll();}
function tog(k){var st=T();
  if(k==='shield'&&!st.shield){var w=heldW();if(w&&w.needsTwoHands){var alt=C().weapons.filter(function(x){return !x.needsTwoHands;})[0];
    if(alt){st.wpn=alt.id;toast('Arme à deux mains rangée → '+alt.name);}}}
  st[k]=!st[k];renderAll();}
function toggleRage(){var st=T();
  if(!st.rage){if((st.pool.rage||0)<=0)return;st.pool.rage--;st.rage=true;}
  else st.rage=false;
  renderAll();}
function setWpn(id){var c=C(),w=wpnById(c,id);if(!w)return;
  if(wBlocked(c,w)){toast('Range le bouclier pour cette arme');return;}
  c.st.wpn=id;renderAll();}
function setFE(k,v2){var st=T();if(k==='w')st.feWpn=v2;else st.feEl=v2;renderAll();}
function setPool(id,n){var st=T();st.pool[id]=(st.pool[id]===n)?n-1:n;renderAll();}
function addPool(id,d){var c=C(),q=(c.pools||[]).filter(function(x){return x.id===id;})[0];if(!q)return;
  var mx=Math.round(num(q.max,V(c)));c.st.pool[id]=Math.max(0,Math.min(mx,(c.st.pool[id]||0)+d));renderAll();}
function togCond(id){var st=T();st.cond[id]=!st.cond[id];renderAll();}
function setT(k,v2){T()[k]=v2;renderAll();}
function nextTurn(){var st=T();st.turn++;
  st.used={action:0,ba:0,reaction:0,traction:0,wpnChg:0};
  if(st.surprise)st.surprise=false;
  UI.exp=null;renderAll();toast('Tour '+st.turn);}
function rest(kind){var c=C(),st=c.st,v=V(c);
  if(kind==='long'){st.pv=pvMax(c);(c.pools||[]).forEach(function(p){st.pool[p.id]=Math.round(num(p.max,v));});}
  (c.pools||[]).forEach(function(p){if(p.recharge==='Par combat')st.pool[p.id]=Math.round(num(p.max,v));});
  st.turn=1;st.rage=false;st.reckless=false;st.surprise=true;st.grappled=false;st.cond={};
  st.used={action:0,ba:0,reaction:0,traction:0,wpnChg:0};
  renderAll();toast(kind==='long'?'Repos long — tout est rechargé':'Nouveau combat');}
function doAction(id){
  var c=C(),st=c.st,a=actAttacks(c).concat(c.actions||[]).filter(function(x){return x.id===id;})[0];
  if(!a)return;
  if(a.tool==='throw'){setTab('lancer');return;}
  if(a.pool)st.pool[a.pool]=Math.max(0,(st.pool[a.pool]||0)-1);
  if(a.free)st.used[a.free]=1;
  else if(a.type==='action')st.used.action=1;
  else if(a.type==='bonus')st.used.ba=1;
  else if(a.type==='reaction')st.used.reaction=1;
  UI.exp=null;renderAll();toast(a.name.replace(/<[^>]+>/g,''));
}

/* ── export / import ────────────────────────────────── */
function dl(txt,name){
  try{var b=new Blob([txt],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove();},400);toast('Fichier exporté');}
  catch(e){openMdl('<div class="mh"><b>Copie manuelle</b><button class="ico" onclick="closeMdl()">✕</button></div>'
    +'<textarea style="min-height:240px" class="mono">'+esc(txt)+'</textarea>');}
}
function stamp(){var d=new Date();return d.toISOString().slice(0,10);}
function expAll(){dl(JSON.stringify(DB),'fiches-combat-'+stamp()+'.json');}
function expOne(){dl(JSON.stringify({v:2,chars:[C()],active:C().id}),
  C().name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+stamp()+'.json');}
function impFile(inp){
  var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{
    var d=JSON.parse(r.result),list=d.chars||(d.id?[d]:null);
    if(!list||!list.length)throw 0;
    var n=0;list.forEach(function(c){
      if(!c.id)c.id=uid();
      c.st=Object.assign(clone(DEF_ST),c.st||{});
      var i=DB.chars.map(function(x){return x.id;}).indexOf(c.id);
      if(i>=0)DB.chars[i]=c;else DB.chars.push(c);n++;});
    DB.active=list[0].id;renderAll();toast(n+' fiche'+(n>1?'s':'')+' importée'+(n>1?'s':''));
  }catch(e){toast('Fichier illisible');}};
  r.readAsText(f);inp.value='';
}

  h+='<div class="card"><div class="ch">🛡️ Défenses et traits</div><div class="cb">'
   +'<div class="fr">'+fN('PV max au niveau '+c.level,(c.hpTable&&c.hpTable[c.level])||c.hpMax||0,"setHP(+this.value)")
   +fN('Vitesse (m)',c.speed,"setC('speed',+this.value)")+'</div>'
   +'<div class="fr">'+fT('Formule de CA',c.acF,"setC('acF',this.value)",'ex. 10+DEX+CON')
   +fN('Bonus du bouclier',c.shieldAC,"setC('shieldAC',+this.value)")+'</div>'
   +'<div class="fr">'+fN('Portée bonus — ton tour',c.reachTurn,"setC('reachTurn',+this.value)",'Longs Membres')
   +fN('Portée bonus — en rage',c.reachRage,"setC('reachRage',+this.value)",'Stature Géante')+'</div>'
   +'<div class="fr">'+fT('Dé du Fendoir',c.feDice,"setC('feDice',this.value)",'vide = aucun')
   +fT('Dés de surprise',c.surpriseDice,"setC('surpriseDice',this.value)")+'</div>'
   +fT('Dégâts de rage au niveau '+c.level,(c.rageDmg&&c.rageDmg[c.level])||0,"setRD(+this.value)")
   +fSw('Doubler les dés d\u2019arme en rage',!!c.rageDoubleDice,"setC('rageDoubleDice',!C0().rageDoubleDice)",'règle maison du MJ')
   +'</div></div>';

  h+='<div class="card"><div class="ch">⚔️ Armes<span class="sub">'+c.weapons.length+'</span></div><div class="cb">'
   +c.weapons.map(function(w,i){
      return itm('w',i,w.icon+' '+w.name,(w.dice||'')+(w.versatile?' / '+w.versatile:'')+' · '+(w.mastery||'sans maîtrise'),
        '<div class="fr">'+fT('Icône',w.icon,"setW("+i+",'icon',this.value)")+fT('Nom',w.name,"setW("+i+",'name',this.value)")+'</div>'
        +'<div class="fr">'+fT('Dés',w.dice,"setW("+i+",'dice',this.value)",'ex. 2d6')
        +fT('Versatile',w.versatile,"setW("+i+",'versatile',this.value)",'à deux mains')+'</div>'
        +'<div class="fr">'+fS('Catégorie',w.category,[['melee','Mêlée'],['thrown','Lancer'],['ranged','Distance']],"setW("+i+",'category',this.value)")
        +fN('Allonge bonus (m)',w.reach,"setW("+i+",'reach',+this.value)")+'</div>'
        +'<div class="fr">'+fT('Portée',w.range,"setW("+i+",'range',this.value)",'ex. 9m / 36m')
        +fT('Maîtrise',w.mastery,"setW("+i+",'mastery',this.value)")+'</div>'
        +fA('Effet',w.eff,"setW("+i+",'eff',this.value)",'{DD} {ATH} {PB} utilisables')
        +fSw('Deux mains obligatoires',!!w.needsTwoHands,"setW("+i+",'needsTwoHands',!C0().weapons["+i+"].needsTwoHands)",'désactivée par le bouclier')
        +fSw('Dés doublés en rage',w.rageDouble!==false,"setW("+i+",'rageDouble',C0().weapons["+i+"].rageDouble===false)")
        +fSw('Peut porter le Fendoir',w.fe!==false,"setW("+i+",'fe',C0().weapons["+i+"].fe===false)")
        +'<button class="btn sm wide" style="border-color:var(--bad);color:var(--bad);margin-top:6px" onclick="delW('+i+')">Supprimer cette arme</button>')}).join('')
   +'<button class="btn wide" onclick="addW()">+ Ajouter une arme</button></div></div>';

  h+='<div class="card"><div class="ch">💠 Ressources<span class="sub">'+(c.pools||[]).length+'</span></div><div class="cb">'
   +(c.pools||[]).map(function(p,i){
      return itm('p',i,p.icon+' '+p.name,'max '+p.max+' · '+(p.recharge||''),
        '<div class="fr">'+fT('Icône',p.icon,"setP("+i+",'icon',this.value)")+fT('Nom',p.name,"setP("+i+",'name',this.value)")+'</div>'
        +'<div class="fr">'+fT('Maximum',p.max,"setP("+i+",'max',this.value)",'nombre ou formule (NIV, PB…)')
        +fS('Recharge',p.recharge,[['Repos long','Repos long'],['Repos court','Repos court'],['Par combat','Par combat'],['Par tour','Par tour']],"setP("+i+",'recharge',this.value)")+'</div>'
        +'<button class="btn sm wide" style="border-color:var(--bad);color:var(--bad)" onclick="delP('+i+')">Supprimer</button>')}).join('')
   +'<button class="btn wide" onclick="addP()">+ Ajouter une ressource</button></div></div>';

  var wopts=[['','— aucune —'],['held','Arme tenue']].concat(c.weapons.map(function(w){return [w.id,w.name];}));
  h+='<div class="card"><div class="ch">📜 Actions<span class="sub">'+(c.actions||[]).length+'</span></div><div class="cb">'
   +'<div class="note" style="margin-bottom:10px">Les attaques d\u2019arme sont générées automatiquement. Cette liste couvre tout le reste.</div>'
   +(c.actions||[]).map(function(a,i){
      var r=a.req||{};
      return itm('a',i,a.name,({action:'Action',bonus:'Action bonus',reaction:'Réaction',free:'Gratuit'})[a.type],
        fT('Nom',a.name,"setA("+i+",'name',this.value)")
        +'<div class="fr">'+fT('Nom anglais',a.en,"setA("+i+",'en',this.value)")
        +fS('Type',a.type,[['action','Action'],['bonus','Action bonus'],['reaction','Réaction'],['free','Gratuit']],"setA("+i+",'type',this.value)")+'</div>'
        +'<div class="fr">'+fT('Portée',a.range,"setA("+i+",'range',this.value)",'{POR} = arme tenue')
        +fT('Dégâts',a.dmg,"setA("+i+",'dmg',this.value)",'ex. 1d10 ou 1d4+FOR')+'</div>'
        +'<div class="fr">'+fS('Arme utilisée',a.wpn,wopts,"setA("+i+",'wpn',this.value)")
        +fT('Dés imposés',a.dice,"setA("+i+",'dice',this.value)",'remplace ceux de l\'arme')+'</div>'
        +fA('Effet',a.eff,"setA("+i+",'eff',this.value)")
        +'<div class="fr">'+fN('Niveau minimum',r.lv||0,"setR("+i+",'lv',+this.value)")
        +fS('Arme requise',(r.wpn&&r.wpn[0])||'',[['','— aucune —']].concat(c.weapons.map(function(w){return [w.id,w.name];})),"setRW("+i+",this.value)")+'</div>'
        +fSw('Rage requise',!!r.rage,"setR("+i+",'rage',C0().actions["+i+"].req&&C0().actions["+i+"].req.rage?0:1)")
        +fSw('Attaque téméraire requise',!!r.reckless,"setR("+i+",'reckless',C0().actions["+i+"].req&&C0().actions["+i+"].req.reckless?0:1)")
        +fSw('Impossible avec bouclier',!!r.noShield,"setR("+i+",'noShield',C0().actions["+i+"].req&&C0().actions["+i+"].req.noShield?0:1)")
        +fS('Consomme une ressource',a.pool||'',[['','— aucune —']].concat((c.pools||[]).map(function(p){return [p.id,p.name];})),"setA("+i+",'pool',this.value)")
        +'<button class="btn sm wide" style="border-color:var(--bad);color:var(--bad)" onclick="delA('+i+')">Supprimer</button>')}).join('')
   +'<button class="btn wide" onclick="addA()">+ Ajouter une action</button></div></div>';

  h+='<div class="card"><div class="ch">⚠️ Rappels<span class="sub">'+(c.rules||[]).length+'</span></div><div class="cb">'
   +(c.rules||[]).map(function(r,i){return '<div class="fr">'+fT('Titre',r[0],"setRule("+i+",0,this.value)")
      +fT('Texte',r[1],"setRule("+i+",1,this.value)")
      +'<div class="f" style="flex:0 0 auto"><label>&nbsp;</label><button class="ico" onclick="delRule('+i+')">🗑</button></div></div>';}).join('')
   +'<button class="btn wide" onclick="addRule()">+ Ajouter un rappel</button></div></div>';

  h+='<button class="btn wide" onclick="UI.edit=null;renderAll()" style="border-color:var(--act);color:var(--act);margin-bottom:8px">Terminer</button>';
  $('t-perso').innerHTML=h;
}
function C0(){return DB.chars.filter(function(x){return x.id===UI.edit;})[0];}
function setC(path,v2){var c=C0(),p=path.split('.'),o=c;
  for(var i=0;i<p.length-1;i++){if(!o[p[i]])o[p[i]]={};o=o[p[i]];}
  if(v2===''&&p[0]==='saveAdv')delete o[p[p.length-1]];else o[p[p.length-1]]=v2;
  if(path==='level'){if(!c.hpTable)c.hpTable={};
    if(!c.hpTable[c.level])c.hpTable[c.level]=pvMax(c);
    save();return renderEditor();}
  save();renderHdr();}
function setHP(v2){var c=C0();if(!c.hpTable)c.hpTable={};c.hpTable[c.level]=v2;c.hpMax=v2;
  if(c.st.pv>v2)c.st.pv=v2;save();renderHdr();}
function setRD(v2){var c=C0();if(!c.rageDmg)c.rageDmg={};c.rageDmg[c.level]=v2;save();}
function togSave(k){var c=C0();c.saveProf=c.saveProf||[];var i=c.saveProf.indexOf(k);
  if(i>=0)c.saveProf.splice(i,1);else c.saveProf.push(k);save();renderEditor();}
function setW(i,k,v2){C0().weapons[i][k]=v2;save();if(k==='icon'||k==='name'||k==='needsTwoHands'||k==='rageDouble'||k==='fe')renderEditor();}
function addW(){var c=C0();c.weapons.push({id:'w'+Date.now().toString(36).slice(-4),icon:'⚔️',name:'Nouvelle arme',
  dice:'1d8',category:'melee',reach:0,mastery:''});UI.o_w=c.weapons.length-1;save();renderEditor();}
function delW(i){var c=C0();c.weapons.splice(i,1);if(!c.weapons.length)addW();
  if(!wpnById(c,c.st.wpn))c.st.wpn=c.weapons[0].id;UI.o_w=-1;save();renderEditor();}
function setP(i,k,v2){C0().pools[i][k]=v2;save();renderEditor();}
function addP(){var c=C0();c.pools=c.pools||[];
  c.pools.push({id:'p'+Date.now().toString(36).slice(-4),icon:'💠',name:'Ressource',max:'1',recharge:'Repos long'});
  c.st.pool[c.pools[c.pools.length-1].id]=1;UI.o_p=c.pools.length-1;save();renderEditor();}
function delP(i){var c=C0();c.pools.splice(i,1);UI.o_p=-1;save();renderEditor();}
function setA(i,k,v2){C0().actions[i][k]=v2;save();if(k==='name'||k==='type')renderEditor();}
function setR(i,k,v2){var a=C0().actions[i];a.req=a.req||{};a.req[k]=v2;save();renderEditor();}
function setRW(i,v2){var a=C0().actions[i];a.req=a.req||{};if(v2)a.req.wpn=[v2];else delete a.req.wpn;save();}
function addA(){var c=C0();c.actions=c.actions||[];
  c.actions.push({id:'a'+Date.now().toString(36).slice(-4),type:'action',name:'Nouvelle action',eff:''});
  UI.o_a=c.actions.length-1;save();renderEditor();}
function delA(i){C0().actions.splice(i,1);UI.o_a=-1;save();renderEditor();}
function setAdv(i,j,v2){C0().advNotes[i][j]=v2;save();}
function addAdv(){var c=C0();c.advNotes=c.advNotes||[];c.advNotes.push(['Situation','Source']);save();renderEditor();}
function delAdv(i){C0().advNotes.splice(i,1);save();renderEditor();}
function setRule(i,j,v2){C0().rules[i][j]=v2;save();}
function addRule(){var c=C0();c.rules=c.rules||[];c.rules.push(['⚠️ Titre','Texte']);save();renderEditor();}
function delRule(i){C0().rules.splice(i,1);save();renderEditor();}

/* ══════════════════════════════════════════════════════════
   DÉMARRAGE
   ══════════════════════════════════════════════════════════ */
function boot(){
  var raw=lsGet(KEY);
  if(raw){try{DB=JSON.parse(raw);}catch(e){DB=null;}}
  if(!DB||!DB.chars||!DB.chars.length)DB={v:2,chars:[clone(DEF_CHAR)],active:DEF_CHAR.id};
  DB.chars.forEach(function(c){
    c.st=Object.assign(clone(DEF_ST),c.st||{});
    c.st.used=Object.assign({action:0,ba:0,reaction:0,traction:0,wpnChg:0},c.st.used||{});
    c.st.cond=c.st.cond||{};c.st.pool=c.st.pool||{};
    (c.pools||[]).forEach(function(p){if(c.st.pool[p.id]==null)c.st.pool[p.id]=Math.round(num(p.max,V(c)));});
    if(!wpnById(c,c.st.wpn)&&c.weapons&&c.weapons[0])c.st.wpn=c.weapons[0].id;
    if(!c.saveAdv){c.saveAdv=c.id===DEF_CHAR.id?clone(DEF_CHAR.saveAdv):{};}
    if(!c.advNotes){c.advNotes=c.id===DEF_CHAR.id?clone(DEF_CHAR.advNotes):[];}
    if(c.saveAdv.con&&/bugbear/i.test(c.saveAdv.con))delete c.saveAdv.con;});
  DB.v=3;
  if(!DB.chars.filter(function(x){return x.id===DB.active;}).length)DB.active=DB.chars[0].id;

  Array.prototype.forEach.call(document.querySelectorAll('.nb'),function(b){
    b.addEventListener('click',function(){setTab(b.dataset.t);});});

  var rep=null,acc=0;
  function stop(){clearTimeout(rep);clearInterval(rep);rep=null;acc=0;}
  document.addEventListener('pointerdown',function(e){
    var b=e.target.closest?e.target.closest('.hold'):null;if(!b)return;
    var d=parseInt(b.dataset.d,10);dPV(d);
    rep=setTimeout(function(){rep=setInterval(function(){acc++;dPV(d*(acc>12?3:1));},95);},420);});
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    document.addEventListener(ev,stop);});
  $('mdl').addEventListener('click',function(e){if(e.target.id==='mdl')closeMdl();});
  document.addEventListener('fullscreenchange',function(){renderHdr();});
  window.addEventListener('resize',function(){renderHdr();});
  try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}catch(e){}
  setTab('tour');
}
boot();
</script>
